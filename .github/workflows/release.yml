# Push a tag vX.Y.Z to build a signed release APK and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
      MAPBOX_KEY: ${{ secrets.MAPBOX_KEY }}
      TRACESTRACK_KEY: ${{ secrets.TRACESTRACK_KEY }}
      OS_KEY: ${{ secrets.OS_KEY }}
      AZURE_KEY: ${{ secrets.AZURE_KEY }}
      CARTOGLISS_KEYSTORE_PASSWORD: ${{ secrets.CARTOGLISS_KEYSTORE_PASSWORD }}
      CARTOGLISS_KEY_ALIAS: ${{ secrets.CARTOGLISS_KEY_ALIAS }}
      CARTOGLISS_KEY_PASSWORD: ${{ secrets.CARTOGLISS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $tag)"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "CARTOGLISS_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "CARTOGLISS_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARTOGLISS_KEYSTORE_BASE64 }}
        run: |
          # A CI debug key changes every run, so its APKs could not update each other: require a real key.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CARTOGLISS_KEYSTORE_PASSWORD" ] || [ -z "$CARTOGLISS_KEY_ALIAS" ]; then
            echo "::error::Set the secrets CARTOGLISS_KEYSTORE_BASE64, CARTOGLISS_KEYSTORE_PASSWORD and CARTOGLISS_KEY_ALIAS"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CARTOGLISS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Accept Android SDK licences (missing SDK parts are downloaded by the build)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="CartoGliss-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "CartoGliss ${GITHUB_REF_NAME}" --generate-notes

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
